<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login / Register – DriveMaster Portal</title>
  <meta name="description" content="Log in to your DriveMaster student portal to book lessons, track hours, and view instructor feedback.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo"><img src="../assets/images/logo.png" alt="DriveMaster" class="logo-img"></a>
        <p style="color:var(--text-muted);margin:0;">Student Portal</p>
      </div>
      
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true">Login</button>
        <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false">Register</button>
      </div>
      
      <!-- Login Form -->
      <form id="login-form" action="../dashboard/index.html" method="GET">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" name="email" class="form-input" required placeholder="you@email.com" value="alex.rivera@email.com">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" name="password" class="form-input" required placeholder="••••••••" value="demo1234" minlength="6">
          <div class="form-error"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:0.875rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
            <input type="checkbox" name="remember"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">Sign In</button>
        <p style="text-align:center;margin-top:1rem;font-size:0.875rem;color:var(--text-muted);">
          Demo: use any email/password and click Sign In → opens Dashboard
        </p>
      </form>
      
      <!-- Register Form (hidden by default) -->
      <form id="register-form" style="display:none;" action="#" method="POST">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" name="name" class="form-input" required placeholder="Your full name">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" class="form-input" required placeholder="you@email.com">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone</label>
          <input type="tel" id="reg-phone" name="phone" class="form-input" placeholder="+1 (555) 000-0000">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" class="form-input" required minlength="6" placeholder="Min. 6 characters">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-course">Interested Course</label>
          <select id="reg-course" name="course" class="form-select">
            <option value="">Select...</option>
            <option>Four-Wheeler</option>
            <option>Two-Wheeler</option>
            <option>Not sure yet</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">Create Account</button>
        <div id="register-success" style="display:none;margin-top:1rem;padding:1rem;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);text-align:center;font-size:0.875rem;">
          Account created! Redirecting to dashboard...
        </div>
      </form>
      
      <p style="text-align:center;margin-top:1.5rem;font-size:0.875rem;">
        <a href="index.html"><i class="bi bi-arrow-left"></i> Back to website</a>
      </p>
      
      <div style="position:absolute;top:1rem;right:1rem;">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <i class="bi bi-sun-fill icon-sun"></i>
          <i class="bi bi-moon-fill icon-moon"></i>
        </button>
      </div>
    </div>
  </div>
  
  <script src="../assets/js/main.js"></script>
  <script>
    // Tab switch: Login / Register
    document.querySelectorAll('[data-auth-tab]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('[data-auth-tab]').forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        const isLogin = tab.dataset.authTab === 'login';
        document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
        document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
      });
    });

    // Login → always go to dashboard (demo: no real auth)
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) {
        alert('Please enter email and password.');
        return;
      }
      // Demo: any credentials work → redirect to student dashboard
      window.location.href = '../dashboard/index.html';
    });

    // Register → show success then go to dashboard
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!name || !email || !password || password.length < 6) {
        alert('Please fill all required fields (password min 6 characters).');
        return;
      }
      const success = document.getElementById('register-success');
      if (success) success.style.display = 'block';
      setTimeout(function () {
        window.location.href = '../dashboard/index.html';
      }, 1200);
    });
  </script>
</body>
</html>
