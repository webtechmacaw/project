<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found – DriveMaster</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="../assets/images/logo.png" alt="DriveMaster" class="logo-img"></a>
      <div class="header-actions">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"><i class="bi bi-sun-fill icon-sun"></i><i class="bi bi-moon-fill icon-moon"></i></button>
        <a href="index.html" class="btn btn-primary btn-sm">Home</a>
      </div>
    </div>
  </header>
  
  <main class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 style="margin-bottom:0.75rem;">Page Not Found</h1>
      <p style="max-width:28rem;margin:0 auto 2rem;color:var(--text-secondary);">
        The page you're looking for doesn't exist or has been moved. Let's get you back on the road.
      </p>
      <div style="display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:center;">
        <a href="index.html" class="btn btn-primary">Go Home</a>
        <a href="contact.html" class="btn btn-outline">Contact Support</a>
        <a href="courses.html" class="btn btn-ghost">View Courses</a>
      </div>
    </div>
  </main>
  
  <script src="../assets/js/main.js"></script>
</body>
</html>
