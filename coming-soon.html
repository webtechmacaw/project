<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon – DriveMaster</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
</head>
<body>
  <main class="error-page" style="background:var(--bg-secondary)">
    <div style="max-width:32rem;">
      <a href="index.html" class="logo"><img src="../assets/images/logo.png" alt="DriveMaster" class="logo-img"></a>
      <h1 style="margin-bottom:0.75rem;">Coming Soon</h1>
      <p style="color:var(--text-secondary);margin-bottom:2rem;">
        We're working on something exciting. Leave your email and we'll notify you when we launch.
      </p>
      <form data-validate data-demo="true" style="display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:center;margin-bottom:1.5rem;">
        <div class="form-group" style="margin:0;flex:1;min-width:200px;">
          <input type="email" class="form-input" required placeholder="Your email" aria-label="Email">
          <div class="form-error"></div>
        </div>
        <button type="submit" class="btn btn-primary">Notify Me</button>
      </form>
      <div data-form-success style="display:none;padding:0.75rem;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);margin-bottom:1rem;">
        Thanks! We'll be in touch. (Demo)
      </div>
      <p style="font-size:0.875rem;color:var(--text-muted);">
        Or <a href="contact.html">contact us</a> if you need help now.
      </p>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" style="margin-top:2rem;">
        <i class="bi bi-sun-fill icon-sun"></i>
        <i class="bi bi-moon-fill icon-moon"></i>
      </button>
    </div>
  </main>
  <script src="../assets/js/main.js"></script>
</body>
</html>
